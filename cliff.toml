# git-cliff: release notes from the commit log. Commits carry a
# conventional prefix over a narrative title -- `feat(cli)!: the command
# line rhymes with itself` -- so the type and scope are machine-readable
# and the sentence stays the summary. Commits from before the convention
# land under "Changed" with their title as written.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.breaking %} **(breaking)**{% endif %}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Docs" },
  { message = "^refactor|^style|^chore|^test|^ci|^build", group = "Internal" },
  { message = ".*", group = "Changed" },
]
