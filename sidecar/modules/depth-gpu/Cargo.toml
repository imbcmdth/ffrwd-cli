[package]
name = "depth-gpu"
version = "0.1.0"
edition = "2021"

# depth's own source with the `gpu` feature on: the build that may hold its
# frames on the GPU, as depth_gpu.wasm beside the host build's depth.wasm.
[lib]
name = "depth_gpu"
path = "../depth/src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["gpu"]
gpu = []

[dependencies]
wit-bindgen = "0.57.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
