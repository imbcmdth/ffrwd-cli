[package]
name = "ffrwd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ffmpeg-shaped sidecar: hosts one ffrwd:av filter between two NUT frame edges"

[lib]
name = "ffrwd_wasm"
path = "src/lib.rs"

[[bin]]
name = "ffrwd-wasm"
path = "src/main.rs"

[dependencies]
ffrwd-wasm-runtime = { path = "../runtime" }
# The NUT wire, which used to be src/nut/, pinned by tag the way ffrwd-frame
# is. The annotation stream is the sidecar's own, so it asks for the feature.
ffrwd-nut = { git = "https://github.com/imbcmdth/ffrwd-nut", tag = "v0.1.0", features = ["annotations"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
# Pins the face detection model facebox compiles in.
sha2 = "0.10"
