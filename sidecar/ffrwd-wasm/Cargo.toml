[package]
name = "ffrwd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ffmpeg-shaped sidecar: hosts one ffrwd:av filter between two NUT frame edges"

[lib]
name = "ffrwd_wasm"
path = "src/lib.rs"

[[bin]]
name = "ffrwd-wasm"
path = "src/main.rs"

[dependencies]
ffrwd-wasm-runtime = { path = "../runtime" }
# The NUT wire, which used to be src/nut/. Its repo is not public yet, so
# this is a path dependency and the wheel CI builds cannot see it; that is
# what makes this branch unmergeable. Flipping it is this one line:
#   ffrwd-nut = { git = "https://github.com/imbcmdth/ffrwd-nut", tag = "v0.1.0", features = ["annotations"] }
ffrwd-nut = { path = "../../../../ffrwd-nut", features = ["annotations"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
# Pins the face detection model facebox compiles in.
sha2 = "0.10"
