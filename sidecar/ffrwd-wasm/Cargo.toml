[package]
name = "ffrwd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ffmpeg-shaped sidecar: hosts one ffrwd:av filter between two NUT frame edges"

[lib]
name = "ffrwd_wasm"
path = "src/lib.rs"

[[bin]]
name = "ffrwd-wasm"
path = "src/main.rs"

[features]
# wasi:webgpu for modules granted -gpu (wgpu: Vulkan, D3D12, Metal). A target
# that cannot build wgpu builds with --no-default-features and refuses such
# modules by name.
default = ["gpu"]
gpu = ["ffrwd-wasm-runtime/gpu"]

[dependencies]
ffrwd-wasm-runtime = { path = "../runtime" }
# The NUT wire, which used to be src/nut/, pinned by tag the way ffrwd-frame
# is. The annotation stream is the sidecar's own, so it asks for the feature.
# A codec package's stream is written under its own four-character tag
# (`Stream::coded_fourcc`), from v0.1.4 on.
ffrwd-nut = { git = "https://github.com/imbcmdth/ffrwd-nut", tag = "v0.1.4", features = ["annotations"] }
# The H.264 byte level, pinned by tag the same way. The SPS this reads is the
# one the NUT wire hands over as extradata.
ffrwd-nal = { git = "https://github.com/imbcmdth/ffrwd-nal", tag = "v0.1.0" }
# yuv420p to rgba and back, in the stream's own range and matrix: what a
# port feed's picture is conformed with. The resize beside it is the same
# library that crate resizes with, over rgba.
ffrwd-frame = { git = "https://github.com/imbcmdth/ffrwd-frame", tag = "v0.1.0" }
fast_image_resize = { version = "6", default-features = false, features = ["std"] }
# The receive buffer a port feed's connection is given.
socket2 = "0.6"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# The relay makes and serves the pipes an edge's bytes cross: named pipes on
# Windows, FIFOs everywhere else.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Pins the face detection model facebox compiles in.
sha2 = "0.10"
