[package]
name = "ffrwd-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ffmpeg-shaped sidecar: hosts one ffrwd:av filter between two NUT frame edges"

[lib]
name = "ffrwd_wasm"
path = "src/lib.rs"

[[bin]]
name = "ffrwd-wasm"
path = "src/main.rs"

[features]
# wasi:webgpu for modules granted -gpu (wgpu: Vulkan, D3D12, Metal). A target
# that cannot build wgpu builds with --no-default-features and refuses such
# modules by name.
default = ["gpu"]
gpu = ["ffrwd-wasm-runtime/gpu"]

[dependencies]
ffrwd-wasm-runtime = { path = "../runtime" }
# The NUT wire, which used to be src/nut/, pinned by tag the way ffrwd-frame
# is. The annotation stream is the sidecar's own, so it asks for the feature.
# A codec package's stream is written under its own four-character tag
# (`Stream::coded_fourcc`), which is the any-fourcc branch, not yet tagged or
# pushed, so it is read from the local checkout for now.
# TODO(codec-worlds): pin ffrwd-nut v0.1.4 once tagged
ffrwd-nut = { path = "E:/projects/ffrwd-nut", features = ["annotations"] }
# The H.264 byte level, pinned by tag the same way. The SPS this reads is the
# one the NUT wire hands over as extradata.
ffrwd-nal = { git = "https://github.com/imbcmdth/ffrwd-nal", tag = "v0.1.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
# Pins the face detection model facebox compiles in.
sha2 = "0.10"
