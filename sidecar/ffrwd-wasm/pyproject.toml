[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "ffrwd-wasm"
version = "0.11.0"
description = "ffmpeg-shaped sidecar: hosts one ffrwd:av filter between two raw frame edges"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.maturin]
bindings = "bin"
