[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "ffrwd-wasm"
version = "0.22.0"
description = "ffmpeg-shaped sidecar: hosts one ffrwd:av filter between two raw frame edges"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://ffrwd.video"
Documentation = "https://ffrwd.video/docs/getting-started"
Source = "https://github.com/imbcmdth/ffrwd-cli"
Issues = "https://github.com/imbcmdth/ffrwd-cli/issues"
Changelog = "https://github.com/imbcmdth/ffrwd-cli/releases"

[tool.maturin]
bindings = "bin"
